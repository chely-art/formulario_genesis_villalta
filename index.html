<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Datos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>


    <div class="form-container">
        <h1>Formulario de datos</h1>


        <label>Usuario</label>
        <input type="text" name="usuario">


        <label>Nombres</label>
        <input type="text" name="nombres" id="nombres">


        <label>Apellidos</label>
        <input type="text" name="apellidos" id="apellidos">


        <label>Contraseña</label>
        <input type="password" name="contra">


        <label>Correo Electrónico</label>
        <input type="email" name="correo">


        <label>Edad</label>
        <input type="number" name="edad">


        <label>Edad oficial</label>
        <input type="number" name="edadoficial" min="18" max="65">


        <label>Puntuación</label>
        <input type="number" name="puntuacion" min="5" max="50" step="5">


        <label>Fecha de Nacimiento</label>
        <input type="date" name="nacimiento">


        <label>Hora de Nacimiento</label>
        <input type="time" name="nacimiento">


        <label>Color Favorito</label>
        <input type="color" name="nacimiento">


        <h2>¿Quién ganó el mundial de fútbol del 2014?</h2>
        <div class="options-group">
            <label><input type="radio" name="pais" value="Alemania"> Alemania</label>
            <label><input type="radio" name="pais" value="Bolivia"> Bolivia</label>
            <label><input type="radio" name="pais" value="Brasil"> Brasil</label>
            <label><input type="radio" name="pais" value="Francia"> Francia</label>
        </div>


        <h2>¿Cuáles son películas de acción?</h2>
        <div class="options-group">
            <label><input type="checkbox" name="películas" value="juego de tronos"> Juego de tronos</label>
            <label><input type="checkbox" name="películas" value="Rápidos y furiosos"> Rápidos y furiosos</label>
            <label><input type="checkbox" name="películas" value="Interstelar"> Interstelar</label>
            <label><input type="checkbox" name="películas" value="El infierno verde"> El infierno verde</label>
            <label><input type="checkbox" name="películas" value="Sentencia de muerte"> Sentencia de muerte</label>
        </div>


        <label>Seleccione un archivo</label>
        <input type="file" name="archivo" accept=".xlsx">


        <label>Seleccione un valor</label>
        <input type="range" name="archivo" min="0" max="100" value="50">


        <button onclick="saludo()">Saludo</button>
        <p id="mensaje"></p>


        <label>Nota teórica</label>
        <input type="number" id="nota_teorica" min="0" max="30">


        <label>Nota práctica</label>
        <input type="number" id="nota_practica" min="0" max="70">


        <button onclick="calculo_nota()">Nota</button>
        <p id="nota_sumada"></p>
    </div>
    <script src="java.java"></script>
</body>
</html>
